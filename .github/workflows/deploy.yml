name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: dnd-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
        env:
          BASE_URL: /
      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/CNAME
          test "$(cat build/CNAME)" = "dnd.eclipse-forge.ru"
          if find build -type l -print -quit | grep -q .; then
            echo "::error::Pages artifact contains a symbolic link"
            exit 1
          fi
          touch build/.nojekyll
      - name: Upload immutable Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dnd-pages-${{ github.sha }}
          path: build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Configure repository authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download verified Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dnd-pages-${{ github.sha }}
          path: build
          digest-mismatch: error
      - name: Publish generated gh-pages snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/.nojekyll
          test "$(cat build/CNAME)" = "dnd.eclipse-forge.ru"
          if find build -type l -print -quit | grep -q .; then
            echo "::error::Downloaded artifact contains a symbolic link"
            exit 1
          fi

          credentials_config="$(git config --local --get "includeIf.gitdir:${GITHUB_WORKSPACE}/.git.path")"
          if [[ ! -f "$credentials_config" ]]; then
            echo "::error::Checkout credential file was not configured"
            exit 1
          fi

          pages_dir="$(mktemp -d)"
          trap 'rm -rf "$pages_dir"' EXIT
          cp -a build/. "$pages_dir/"
          git -C "$pages_dir" init --initial-branch=gh-pages
          git -C "$pages_dir" config user.name "github-actions[bot]"
          git -C "$pages_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pages_dir" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$pages_dir" add --all
          git -C "$pages_dir" commit -m "Deploy ${GITHUB_SHA}"
          git -C "$pages_dir" -c "include.path=${credentials_config}" push --force origin gh-pages:gh-pages
