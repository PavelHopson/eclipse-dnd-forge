name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions: {}

jobs:
  deployment-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Classify the complete source push without executing repository code
        id: scope
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            async function deploymentScope({github,context,bootstrapBase,bootstrapFiles}) {
              const event=context.eventName;
              const repo=context.repo;
              let before=context.payload.before;
              let after=context.sha;
              if(event==='workflow_dispatch') return true;
              if(event==='workflow_run') {
                const run=context.payload.workflow_run;
                if(run?.event!=='push'||run.conclusion!=='success'||run.head_repository?.full_name!==`${repo.owner}/${repo.repo}`) return false;
                if(!Number.isSafeInteger(run.check_suite_id)) throw Error('Missing source push check suite');
                const {data:suite}=await github.rest.checks.getSuite({...repo,check_suite_id:run.check_suite_id});
                if(suite.head_sha!==run.head_sha||suite.after!==run.head_sha||suite.head_branch!==run.head_branch) throw Error('Source push mismatch');
                before=suite.before; after=suite.after;
              } else if(event!=='push') return false;
              const valid=v=>typeof v==='string'&&/^[a-f0-9]{40}$/.test(v)&&!/^0+$/.test(v);
              if(!valid(before)||!valid(after)||before===after) throw Error('Unknown push range: deployment requires manual review');
              const {data:comparison}=await github.rest.repos.compareCommitsWithBasehead({...repo,basehead:`${before}...${after}`,per_page:100,page:1});
              // The Compare API returns at most 300 changed files, even with pagination.
              // Fail closed at that boundary instead of guessing that omitted files are documentation.
              if(comparison.status!=='ahead'||comparison.behind_by!==0||comparison.merge_base_commit?.sha!==before||!Array.isArray(comparison.files)||comparison.files.length===0||comparison.files.length>=300) throw Error('Incomplete change list: deployment requires manual review');
              const documentation=p=>p==='README.md'||p==='docs/repository-guide.md'||p==='docs/assets/repository-cover.svg'||p.startsWith('docs/assets/ui/')||p.startsWith('docs/portfolio/');
              const knownPath=p=>typeof p==='string'&&p.length>0&&!p.includes('..')&&!p.includes('\\')&&!p.startsWith('/');
              const ignored=p=>documentation(p)||(before===bootstrapBase&&bootstrapFiles.includes(p));
              for(const file of comparison.files){
                if(!knownPath(file.filename)||(file.previous_filename!==undefined&&!knownPath(file.previous_filename))) throw Error('Invalid changed path');
                // A rename from runtime into docs still changes runtime.
                if(!ignored(file.filename)||(file.previous_filename&&!ignored(file.previous_filename))) return true;
              }
              return false;
            }
            const required = await deploymentScope({ github, context, bootstrapBase: "82b81fece9bdec214a56b0803c909d5c192c9652", bootstrapFiles: ["README.md","docs/repository-guide.md","docs/assets/repository-cover.svg","docs/assets/ui/overview.png","docs/assets/ui/mobile.png","docs/assets/ui/capture.json",".github/workflows/deploy.yml"] });
            core.setOutput('required', String(required));
            core.info(required ? 'Runtime changes: existing deployment gates remain in force.' : 'Presentation-only change: deployment is not required.');

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Validate BFF runtime scripts
        run: bash -n deploy/scripts/*.sh
      - name: Lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
        env:
          BASE_URL: /
          VITE_DND_IDENTITY_CANARY_ENABLED: true
      - name: Enforce initial bundle budget
        run: npm run bundle:check
      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/CNAME
          test "$(cat build/CNAME)" = "dnd.eclipse-forge.ru"
          if find build -type l -print -quit | grep -q .; then
            echo "::error::Pages artifact contains a symbolic link"
            exit 1
          fi
          touch build/.nojekyll
      - name: Upload immutable Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dnd-pages-${{ github.sha }}
          path: build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: ["build","deployment-scope"]
    if: >-
      needs.deployment-scope.outputs.required == 'true'
    concurrency:
      group: dnd-pages-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Configure repository authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download verified Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dnd-pages-${{ github.sha }}
          path: build
          digest-mismatch: error
      - name: Publish generated gh-pages snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/.nojekyll
          test "$(cat build/CNAME)" = "dnd.eclipse-forge.ru"
          if find build -type l -print -quit | grep -q .; then
            echo "::error::Downloaded artifact contains a symbolic link"
            exit 1
          fi

          credentials_config="$(git config --local --get "includeIf.gitdir:${GITHUB_WORKSPACE}/.git.path")"
          if [[ ! -f "$credentials_config" ]]; then
            echo "::error::Checkout credential file was not configured"
            exit 1
          fi

          pages_dir="$(mktemp -d)"
          trap 'rm -rf "$pages_dir"' EXIT
          cp -a build/. "$pages_dir/"
          git -C "$pages_dir" init --initial-branch=gh-pages
          git -C "$pages_dir" config user.name "github-actions[bot]"
          git -C "$pages_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pages_dir" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$pages_dir" add --all
          git -C "$pages_dir" commit -m "Deploy ${GITHUB_SHA}"
          git -C "$pages_dir" -c "include.path=${credentials_config}" push --force origin gh-pages:gh-pages
